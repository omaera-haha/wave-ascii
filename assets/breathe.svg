<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="400" height="400">
  <!-- Breathe: six petals open and turn while breathing in for four seconds,
       hold, and close while breathing out. Screen blending makes the overlaps
       glow. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0.35" stop-color="#3fe0c8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3fe0c8" stop-opacity="0"/>
    </radialGradient>
    <circle id="petal" cx="0" r="26" opacity="0.72">
      <animate attributeName="cx" values="0;40;40;0;0" keyTimes="0;0.4;0.5;0.95;1"
               calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1;0 0 1 1"
               dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="26;40;40;26;26" keyTimes="0;0.4;0.5;0.95;1"
               calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1;0 0 1 1"
               dur="10s" repeatCount="indefinite"/>
    </circle>
  </defs>
  <circle r="50" fill="url(#halo)">
    <animate attributeName="r" values="50;98;98;50;50" keyTimes="0;0.4;0.5;0.95;1"
             calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1;0 0 1 1"
             dur="10s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-30;60;60;-30;-30"
                      keyTimes="0;0.4;0.5;0.95;1" calcMode="spline"
                      keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1;0 0 1 1"
                      dur="10s" repeatCount="indefinite"/>
    <use href="#petal" fill="#2fd3c6" style="mix-blend-mode:screen"/>
    <use href="#petal" fill="#5aa9ff" transform="rotate(60)" style="mix-blend-mode:screen"/>
    <use href="#petal" fill="#7ef0b0" transform="rotate(120)" style="mix-blend-mode:screen"/>
    <use href="#petal" fill="#2fd3c6" transform="rotate(180)" style="mix-blend-mode:screen"/>
    <use href="#petal" fill="#5aa9ff" transform="rotate(240)" style="mix-blend-mode:screen"/>
    <use href="#petal" fill="#7ef0b0" transform="rotate(300)" style="mix-blend-mode:screen"/>
  </g>
</svg>
