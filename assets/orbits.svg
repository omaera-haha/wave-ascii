<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360">
  <!-- Orbits: three planets on tilted orbits around a glowing sun. The
       planets are drawn twice, clipped to the far half behind the sun and the
       near half in front of it, and grow as they come closer. -->
  <defs>
    <radialGradient id="corona">
      <stop offset="0.3" stop-color="#ffb347" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.55" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffc2b3"/>
      <stop offset="1" stop-color="#ff6b5b"/>
    </radialGradient>
    <radialGradient id="tide" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#b5fff5"/>
      <stop offset="1" stop-color="#22c3b8"/>
    </radialGradient>
    <radialGradient id="dusk" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e2d6ff"/>
      <stop offset="1" stop-color="#8f6dff"/>
    </radialGradient>
    <clipPath id="far"><rect width="320" height="90"/></clipPath>
    <clipPath id="near"><rect y="90" width="320" height="90"/></clipPath>

    <g id="planets">
      <g>
        <animateMotion path="M222 90 A62 26 0 1 1 98 90 A62 26 0 1 1 222 90"
                       dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1;0.75;1"
                          calcMode="spline"
                          keySplines="0.61 1 0.88 1;0.12 0 0.39 0;0.61 1 0.88 1;0.12 0 0.39 0"
                          dur="7s" repeatCount="indefinite"/>
        <circle r="7" fill="url(#ember)"/>
      </g>
      <g>
        <animateMotion path="M258 90 A98 41 0 1 1 62 90 A98 41 0 1 1 258 90"
                       begin="-4s" dur="13s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1;0.75;1"
                          calcMode="spline"
                          keySplines="0.61 1 0.88 1;0.12 0 0.39 0;0.61 1 0.88 1;0.12 0 0.39 0"
                          begin="-4s" dur="13s" repeatCount="indefinite"/>
        <circle r="10.5" fill="url(#tide)"/>
        <circle r="3" fill="#ecebff">
          <animateMotion path="M22 0 A22 15 0 1 1 -22 0 A22 15 0 1 1 22 0"
                         dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateMotion path="M300 90 A140 59 0 1 1 20 90 A140 59 0 1 1 300 90"
                       begin="-15s" dur="21s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1;0.75;1"
                          calcMode="spline"
                          keySplines="0.61 1 0.88 1;0.12 0 0.39 0;0.61 1 0.88 1;0.12 0 0.39 0"
                          begin="-15s" dur="21s" repeatCount="indefinite"/>
        <g transform="rotate(-16)" fill="none" stroke="#f7d9a8" stroke-width="3">
          <path d="M-26 0 A26 7.5 0 0 1 26 0"/>
          <circle r="13.5" fill="url(#dusk)" stroke="none"/>
          <path d="M26 0 A26 7.5 0 0 1 -26 0"/>
        </g>
      </g>
    </g>
  </defs>

  <g fill="#d6ddff">
    <circle cx="22" cy="18" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="71" cy="36" r="1"><animate attributeName="opacity" values="0.2;1;0.2" begin="-1.2s" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="12" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" begin="-2s" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="206" cy="20" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" begin="-0.6s" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="262" cy="10" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" begin="-2.7s" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="34" r="1"><animate attributeName="opacity" values="0.2;1;0.2" begin="-1.5s" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="14" cy="150" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" begin="-3s" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="58" cy="170" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" begin="-0.9s" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="172" r="1"><animate attributeName="opacity" values="0.2;1;0.2" begin="-2.2s" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="236" cy="166" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" begin="-1.8s" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="306" cy="146" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" begin="-0.3s" dur="5.4s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke="#8ea2ff" stroke-opacity="0.45" stroke-width="1.8">
    <ellipse cx="160" cy="90" rx="62" ry="26"/>
    <ellipse cx="160" cy="90" rx="98" ry="41"/>
    <ellipse cx="160" cy="90" rx="140" ry="59"/>
  </g>

  <use href="#planets" clip-path="url(#far)"/>
  <circle cx="160" cy="90" r="48" fill="url(#corona)">
    <animate attributeName="r" values="46;58;46" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="90" r="23" fill="url(#sun)"/>
  <use href="#planets" clip-path="url(#near)"/>
</svg>
