  <use href="#ray" transform="rotate(307.5)"/>
  <use href="#ray" transform="rotate(322.5)"/>
  <use href="#ray" transform="rotate(337.5)"/>
  <use href="#ray" transform="rotate(352.5)"/>
  <use href="#leaf" transform="rotate(15)"/>
  <use href="#leaf" transform="rotate(45)"/>
  <use href="#leaf" transform="rotate(75)"/>
  <use href="#leaf" transform="rotate(105)"/>
  <use href="#leaf" transform="rotate(135)"/>
  <use href="#leaf" transform="rotate(165)"/>
  <use href="#leaf" transform="rotate(195)"/>
  <use href="#leaf" transform="rotate(225)"/>
  <use href="#leaf" transform="rotate(255)"/>
  <use href="#leaf" transform="rotate(285)"/>
  <use href="#leaf" transform="rotate(315)"/>
  <use href="#leaf" transform="rotate(345)"/>
  <use href="#lotus-petal" transform="rotate(0)"/>
  <use href="#lotus-petal" transform="rotate(30)"/>
  <use href="#lotus-petal" transform="rotate(60)"/>
  <use href="#lotus-petal" transform="rotate(90)"/>
