<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="400" height="400">
  <!-- Each motif is drawn once, pointing up, and repeated around the center. -->
  <defs>
    <g id="lotus-petal">
      <path d="M0 -48 C19 -56 19 -76 0 -90 C-19 -76 -19 -56 0 -48 Z" fill="#a30f48"/>
      <path d="M0 -57 C10 -62 10 -74 0 -82 C-10 -74 -10 -62 0 -57 Z" fill="#ff7fa8"/>
      <circle cy="-97" r="3.5" fill="#ffd45c"/>
    </g>
    <g id="leaf">
      <path d="M0 -48 C10 -58 10 -72 0 -84 C-10 -72 -10 -58 0 -48 Z" fill="#1cc98a"/>
      <circle cy="-88" r="2.6" fill="#ffd45c"/>
    </g>
    <g id="sapphire-petal">
      <path d="M0 -16 C14 -22 14 -40 0 -45 C-14 -40 -14 -22 0 -16 Z" fill="#2a4fd0"/>
      <path d="M0 -25 C7 -28 7 -36 0 -39 C-7 -36 -7 -28 0 -25 Z" fill="#7ff7e6"/>
    </g>
    <path id="ray" d="M0 -60 L2.6 -80 L0 -95 L-2.6 -80 Z" fill="#ffc83d"/>
    <circle id="bead" cy="-40" r="3" fill="#ffd45c"/>
    <path id="star-point" d="M0 -5 C5 -9 4 -15 0 -21 C-4 -15 -5 -9 0 -5 Z" fill="#ffc83d"/>
  </defs>
  <!-- Emerald leaves peek out between the ruby lotus petals. -->
  <use href="#ray" transform="rotate(7.5)"/>
  <use href="#ray" transform="rotate(22.5)"/>
  <use href="#ray" transform="rotate(37.5)"/>
  <use href="#ray" transform="rotate(52.5)"/>
  <use href="#ray" transform="rotate(67.5)"/>
  <use href="#ray" transform="rotate(82.5)"/>
  <use href="#ray" transform="rotate(97.5)"/>
  <use href="#ray" transform="rotate(112.5)"/>
  <use href="#ray" transform="rotate(127.5)"/>
  <use href="#ray" transform="rotate(142.5)"/>
  <use href="#ray" transform="rotate(157.5)"/>
  <use href="#ray" transform="rotate(172.5)"/>
  <use href="#ray" transform="rotate(187.5)"/>
  <use href="#ray" transform="rotate(202.5)"/>
  <use href="#ray" transform="rotate(217.5)"/>
  <use href="#ray" transform="rotate(232.5)"/>
  <use href="#ray" transform="rotate(247.5)"/>
  <use href="#ray" transform="rotate(262.5)"/>
