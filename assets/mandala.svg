  <use href="#bead" transform="rotate(247.5)"/>
  <use href="#bead" transform="rotate(292.5)"/>
  <use href="#bead" transform="rotate(337.5)"/>
  <!-- Gold star with a ruby and pearl heart. -->
  <use href="#star-point" transform="rotate(22.5)"/>
  <use href="#star-point" transform="rotate(67.5)"/>
  <use href="#star-point" transform="rotate(112.5)"/>
  <use href="#star-point" transform="rotate(157.5)"/>
  <use href="#star-point" transform="rotate(202.5)"/>
  <use href="#star-point" transform="rotate(247.5)"/>
  <use href="#star-point" transform="rotate(292.5)"/>
  <use href="#star-point" transform="rotate(337.5)"/>
