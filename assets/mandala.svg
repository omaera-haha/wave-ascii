  <use href="#lotus-petal" transform="rotate(330)"/>
  <!-- Gold band around a violet field of sapphire petals. -->
  <circle r="47" fill="#33176e" stroke="#ffc83d" stroke-width="5"/>
  <use href="#sapphire-petal" transform="rotate(0)"/>
  <use href="#sapphire-petal" transform="rotate(45)"/>
  <use href="#sapphire-petal" transform="rotate(90)"/>
  <use href="#sapphire-petal" transform="rotate(135)"/>
