[package]
name = "wave-ascii"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
glam = { version = "0.34.1", features = ["serde"] }
jiff = "0.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
